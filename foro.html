<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foro — Cotizador de Aberturas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { margin: 0; }
    .topbar {
      background: var(--color-bg-alt);
      border-bottom: 1px solid var(--color-border);
      padding: 12px 24px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar a { color: var(--color-primary); text-decoration: none; }
    .topbar a:hover { text-decoration: underline; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    .header h1 { margin: 0; font-size: 1.3rem; }
    .header-right { display: flex; gap: 20px; align-items: center; }

    .buscar-container {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 500px;
    }
    .buscar-container input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--color-campo-borde);
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .buscar-container button {
      padding: 10px 16px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .buscar-container button:hover { opacity: 0.9; }

    .main-layout {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 0;
      height: calc(100vh - 200px);
    }
    .listado-panel {
      border-right: 1px solid var(--color-border);
      overflow-y: auto;
      background: var(--color-surface);
    }
    .detalle-panel {
      overflow-y: auto;
      padding: 24px;
      background: var(--color-bg-alt);
    }

    .pregunta-item {
      padding: 16px;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      transition: background 0.2s;
    }
    .pregunta-item:hover { background: var(--color-bg-alt); }
    .pregunta-item.activa { background: var(--color-primary); color: white; }
    .pregunta-item.activa .titulo,
    .pregunta-item.activa .autor,
    .pregunta-item.activa .preview { color: white; }
    .pregunta-item.activa .fecha { color: rgba(255,255,255,0.7); }

    .titulo { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .autor { font-size: 0.85rem; color: var(--color-text-muted); }
    .fecha { font-size: 0.75rem; color: var(--color-text-muted); margin-top: 4px; }
    .preview { font-size: 0.85rem; color: var(--color-text-muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .detalle-contenido { background: var(--color-surface); padding: 24px; border-radius: 8px; margin-bottom: 24px; }
    .detalle-titulo { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; }
    .detalle-meta { font-size: 0.9rem; color: var(--color-text-muted); margin-bottom: 12px; }
    .detalle-categoria { display: inline-block; padding: 4px 12px; background: var(--color-primary); color: white; border-radius: 999px; font-size: 0.8rem; margin-left: 12px; }
    .detalle-contenido-texto { line-height: 1.6; color: var(--color-text-body); margin: 16px 0; }

    .imagenes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 16px 0;
    }
    .imagen-thumb { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }

    .votos-section { display: flex; gap: 16px; align-items: center; margin: 16px 0; padding-top: 16px; border-top: 1px solid var(--color-border); }
    .voto-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--color-text-muted); padding: 0; }
    .voto-btn:hover { color: var(--color-primary); }
    .voto-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .respuestas-section { margin-top: 40px; }
    .respuesta { background: var(--color-bg-alt); padding: 16px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid var(--color-primary); }
    .respuesta-autor { font-weight: 600; font-size: 0.95rem; }
    .respuesta-fecha { font-size: 0.85rem; color: var(--color-text-muted); }
    .respuesta-contenido { margin-top: 8px; line-height: 1.6; }

    .formulario-respuesta { background: var(--color-surface); padding: 20px; border-radius: 8px; margin-top: 20px; }
    .form-grupo { margin-bottom: 16px; }
    .form-grupo label { display: block; margin-bottom: 6px; font-weight: 500; }
    .form-grupo input,
    .form-grupo textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--color-campo-borde);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    .form-grupo textarea { min-height: 100px; resize: vertical; }

    .btn-responder { width: 100%; padding: 10px; background: var(--color-primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .btn-responder:hover { opacity: 0.9; }

    .empty-state { text-align: center; color: var(--color-text-muted); padding: 40px 24px; }

    .loading { text-align: center; color: var(--color-text-muted); padding: 20px; }
    .error { color: #c33; padding: 12px; background: #fee; border-radius: 6px; margin: 10px 0; }
    .success { color: #3c3; padding: 12px; background: #efe; border-radius: 6px; margin: 10px 0; }

    .user-section { font-size: 0.9rem; color: var(--color-text-muted); display: flex; align-items: center; gap: 12px; }
    .tema { display: flex; gap: 8px; }
    .tema__btn { padding: 6px 12px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .tema__btn[aria-pressed="true"] { background: var(--color-primary); color: white; border-color: var(--color-primary); }

    @media (max-width: 768px) {
      .main-layout { grid-template-columns: 1fr; }
      .listado-panel { display: none; }
      .listado-panel.mobile-visible { display: block; }
      .detalle-panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <!-- Topbar -->
  <div class="topbar">
    <a href="index.html">← Volver a <strong>Cotizador de Aberturas</strong></a>
    <span></span>
  </div>

  <!-- Header -->
  <div class="header">
    <h1>Foro de Carpinteros</h1>
    <div class="header-right">
      <div class="tema" role="group" aria-label="Tema de color">
        <button class="tema__btn" type="button" data-tema-btn="blanco" aria-pressed="true">Blanco</button>
        <button class="tema__btn" type="button" data-tema-btn="silver" aria-pressed="false">Silver</button>
      </div>
      <div id="userStatus" class="user-section"></div>
    </div>
  </div>

  <!-- Buscador + Descarga -->
  <div style="padding: 16px 24px; background: var(--color-surface); border-bottom: 1px solid var(--color-border);">
    <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 12px;">
      <div class="buscar-container" style="flex: 1;">
        <input type="text" id="buscar" placeholder="Buscar en el foro..." />
        <button onclick="buscar()">Buscar</button>
        <button onclick="limpiarBusqueda()" style="background: var(--color-text-muted);">Limpiar</button>
      </div>
      <a href="index.html#descargas" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 16px; background: var(--color-primary); color: white; border-radius: 6px; text-decoration: none; font-weight: 600; text-align: center; line-height: 1.2;">
        <span style="font-size: 0.9rem;">📥 Descarga el Cotizador</span>
        <span style="font-size: 0.75rem; opacity: 0.9;">de Aberturas - 3 días gratis</span>
      </a>
    </div>
  </div>

  <!-- Layout principal -->
  <div class="main-layout">
    <!-- Listado de preguntas -->
    <div class="listado-panel" id="listadoPanel">
      <div id="preguntasLista" class="loading">Cargando preguntas...</div>
    </div>

    <!-- Detalle de pregunta -->
    <div class="detalle-panel" id="detallePanel">
      <div class="empty-state">
        <p>Selecciona una pregunta para verla</p>
      </div>
    </div>
  </div>

  <!-- Modal: Participar -->
  <div class="modal" id="authModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: var(--color-surface); border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; position: relative;">
      <button style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.5rem; cursor: pointer;" onclick="cerrarAuthModal()">&times;</button>
      <h2 style="margin-top: 0;">Participar en el foro</h2>
      <form id="formAuth">
        <div class="form-grupo checkbox" style="display: flex; align-items: center;">
          <input type="checkbox" id="modoInvitado" onchange="toggleModoInvitado()" style="width: auto; margin-right: 8px;" />
          <label for="modoInvitado" style="margin-bottom: 0;">Participar como invitado</label>
        </div>

        <div class="form-grupo">
          <label>Email *</label>
          <input type="email" id="authEmail" required />
        </div>
        <div class="form-grupo">
          <label>Nombre *</label>
          <input type="text" id="authNombre" required />
        </div>
        <div class="form-grupo" id="passwordGroup">
          <label>Contraseña *</label>
          <input type="password" id="authPassword" required />
        </div>

        <button class="btn-responder" type="submit" id="btnAuthSubmit">Entrar como invitado</button>
        <div id="authError"></div>
      </form>
    </div>
  </div>

  <script>
    const ENDPOINT = "https://cotizador-forum.fgpereyra-92.workers.dev";
    let usuarioActual = null;
    let preguntaSeleccionada = null;
    let todasLasPreguntas = [];
    let terminoBusqueda = "";

    // Tema
    function inicializarTema() {
      const guardado = localStorage.getItem("tema");
      const tema = guardado === "silver" ? "silver" : "blanco";
      document.documentElement.setAttribute("data-tema", tema);
      document.querySelectorAll(".tema__btn").forEach(btn => {
        btn.setAttribute("aria-pressed", btn.dataset.temaBtn === tema);
      });
    }

    document.querySelectorAll(".tema__btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const tema = btn.dataset.temaBtn;
        localStorage.setItem("tema", tema);
        document.documentElement.setAttribute("data-tema", tema);
        document.querySelectorAll(".tema__btn").forEach(b => {
          b.setAttribute("aria-pressed", b.dataset.temaBtn === tema);
        });
      });
    });

    // Auth
    function mostrarAuthModal() {
      document.getElementById("modoInvitado").checked = true;
      toggleModoInvitado();
      document.getElementById("authModal").style.display = "flex";
    }

    function cerrarAuthModal() {
      document.getElementById("authModal").style.display = "none";
    }

    function toggleModoInvitado() {
      const esInvitado = document.getElementById("modoInvitado").checked;
      document.getElementById("passwordGroup").style.display = esInvitado ? "none" : "block";
      document.getElementById("btnAuthSubmit").textContent = esInvitado ? "Entrar como invitado" : "Crear cuenta";
      document.getElementById("authPassword").required = !esInvitado;
    }

    document.getElementById("formAuth").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("authEmail").value;
      const nombre = document.getElementById("authNombre").value;
      const esInvitado = document.getElementById("modoInvitado").checked;
      const password = document.getElementById("authPassword").value;

      let endpoint = "/api/auth/invitado";
      let body = { email, nombre };

      if (!esInvitado && password) {
        endpoint = "/api/auth/login";
        body.password = password;
      }

      try {
        const res = await fetch(ENDPOINT + endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.ok && data.usuario) {
          usuarioActual = data.usuario;
          localStorage.setItem("usuario", JSON.stringify(usuarioActual));
          actualizarUserStatus();
          cerrarAuthModal();
          document.getElementById("formAuth").reset();
        } else {
          document.getElementById("authError").innerHTML = `<div class="error">${data.error}</div>`;
        }
      } catch (e) {
        document.getElementById("authError").innerHTML = `<div class="error">${e.message}</div>`;
      }
    });

    function actualizarUserStatus() {
      const status = document.getElementById("userStatus");
      if (usuarioActual) {
        status.innerHTML = `
          <div style="display: flex; gap: 12px; align-items: center;">
            <span>${usuarioActual.nombre}${usuarioActual.es_invitado ? " (invitado)" : ""}</span>
            <button onclick="logout()" class="btn btn--sm" style="padding: 6px 12px;">Salir</button>
          </div>
        `;
      } else {
        status.innerHTML = `<button class="btn btn--primary btn--sm" onclick="mostrarAuthModal()">Participar</button>`;
      }
    }

    function logout() {
      usuarioActual = null;
      localStorage.removeItem("usuario");
      actualizarUserStatus();
      preguntaSeleccionada = null;
      document.getElementById("detallePanel").innerHTML = '<div class="empty-state"><p>Selecciona una pregunta para verla</p></div>';
    }

    // Cargar preguntas
    async function cargarPreguntas() {
      try {
        const res = await fetch(ENDPOINT + "/api/preguntas");
        const data = await res.json();
        todasLasPreguntas = data.preguntas || [];
        renderizarListado(todasLasPreguntas);
      } catch (e) {
        document.getElementById("preguntasLista").innerHTML = `<div class="error">Error: ${e.message}</div>`;
      }
    }

    function renderizarListado(preguntas) {
      const container = document.getElementById("preguntasLista");
      if (!preguntas || preguntas.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No hay preguntas</p></div>';
        return;
      }

      container.innerHTML = preguntas.map(p => `
        <div class="pregunta-item ${preguntaSeleccionada?.id === p.id ? 'activa' : ''}" onclick="seleccionarPregunta(${p.id})">
          <div class="titulo">${escape(p.titulo)}</div>
          <div class="autor">${escape(p.autor)}</div>
          <div class="preview">${escape(p.contenido.substring(0, 60))}</div>
          <div class="fecha">${formatearFecha(p.fecha)}</div>
        </div>
      `).join("");
    }

    function seleccionarPregunta(id) {
      const pregunta = todasLasPreguntas.find(p => p.id === id);
      if (!pregunta) return;

      preguntaSeleccionada = pregunta;
      document.querySelectorAll(".pregunta-item").forEach(p => p.classList.remove("activa"));
      event.target.closest(".pregunta-item").classList.add("activa");

      mostrarDetalle(pregunta);
      cargarRespuestas(id);
    }

    function mostrarDetalle(p) {
      const panel = document.getElementById("detallePanel");
      panel.innerHTML = `
        <div class="detalle-contenido">
          <h2 class="detalle-titulo">${escape(p.titulo)}</h2>
          <div class="detalle-meta">
            <strong>${escape(p.autor)}</strong> • ${formatearFecha(p.fecha)}
            <span class="detalle-categoria">${p.categoria_nombre}</span>
          </div>
          <div class="detalle-contenido-texto">${escape(p.contenido)}</div>
          ${p.imagenes ? `
            <div class="imagenes-grid">
              ${JSON.parse(p.imagenes).map(img => `<img src="${img}" alt="Imagen" class="imagen-thumb" />`).join("")}
            </div>
          ` : ""}
          <div class="votos-section">
            <button class="voto-btn" onclick="votar(${p.id}, 'preguntas', 'up')" ${!usuarioActual ? "disabled" : ""}>👍</button>
            <span>${p.votos || 0}</span>
            <button class="voto-btn" onclick="votar(${p.id}, 'preguntas', 'down')" ${!usuarioActual ? "disabled" : ""}>👎</button>
          </div>
        </div>

        <div class="respuestas-section">
          <h3>Respuestas</h3>
          <div id="respuestasLista" class="loading">Cargando respuestas...</div>
        </div>

        <div class="formulario-respuesta">
          <h4 style="margin-top: 0;">Responder</h4>
          ${!usuarioActual ? `
            <p style="color: var(--color-text-muted);">
              <a href="#" onclick="mostrarAuthModal(); return false;">Inicia sesión o participa como invitado</a> para responder
            </p>
          ` : `
            <form id="formRespuesta" onsubmit="enviarRespuesta(event, ${p.id})">
              <div class="form-grupo">
                <label>Tu respuesta *</label>
                <textarea id="respuestaTexto" placeholder="Escribe tu respuesta aquí..." required></textarea>
              </div>
              <button type="submit" class="btn-responder">Enviar respuesta</button>
              <div id="respuestaError"></div>
            </form>
          `}
        </div>
      `;
    }

    async function cargarRespuestas(idPregunta) {
      try {
        const res = await fetch(`${ENDPOINT}/api/preguntas/${idPregunta}/respuestas`);
        const data = await res.json();
        const container = document.getElementById("respuestasLista");

        if (!data.respuestas || data.respuestas.length === 0) {
          container.innerHTML = '<p style="color: var(--color-text-muted);">No hay respuestas aún</p>';
          return;
        }

        container.innerHTML = data.respuestas.map(r => `
          <div class="respuesta">
            <div class="respuesta-autor">${escape(r.autor)}</div>
            <div class="respuesta-fecha">${formatearFecha(r.fecha)} • 👍 ${r.votos || 0}</div>
            <div class="respuesta-contenido">${escape(r.contenido)}</div>
          </div>
        `).join("");
      } catch (e) {
        document.getElementById("respuestasLista").innerHTML = `<div class="error">Error: ${e.message}</div>`;
      }
    }

    async function enviarRespuesta(e, idPregunta) {
      e.preventDefault();
      const contenido = document.getElementById("respuestaTexto").value;

      if (!contenido || contenido.length < 5) {
        document.getElementById("respuestaError").innerHTML = '<div class="error">La respuesta debe tener al menos 5 caracteres</div>';
        return;
      }

      try {
        const res = await fetch(ENDPOINT + "/api/respuestas", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usuario_id: usuarioActual.id,
            id_pregunta: idPregunta,
            contenido
          })
        });

        const data = await res.json();
        if (data.ok) {
          document.getElementById("respuestaError").innerHTML = '<div class="success">¡Respuesta enviada!</div>';
          document.getElementById("respuestaTexto").value = "";
          setTimeout(() => cargarRespuestas(idPregunta), 1000);
        } else {
          document.getElementById("respuestaError").innerHTML = `<div class="error">${data.error}</div>`;
        }
      } catch (e) {
        document.getElementById("respuestaError").innerHTML = `<div class="error">${e.message}</div>`;
      }
    }

    // Búsqueda
    function buscar() {
      const q = document.getElementById("buscar").value.trim();
      if (q.length < 2) {
        document.getElementById("preguntasLista").innerHTML = '<div class="empty-state"><p>Escribe al menos 2 caracteres</p></div>';
        return;
      }

      const filtradas = todasLasPreguntas.filter(p =>
        p.titulo.toLowerCase().includes(q.toLowerCase()) ||
        p.contenido.toLowerCase().includes(q.toLowerCase())
      );

      terminoBusqueda = q;
      renderizarListado(filtradas);
    }

    function limpiarBusqueda() {
      document.getElementById("buscar").value = "";
      terminoBusqueda = "";
      renderizarListado(todasLasPreguntas);
    }

    // Utilidades
    function escape(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function formatearFecha(fecha) {
      return new Date(fecha).toLocaleDateString("es-AR");
    }

    async function votar(id, tabla, tipo) {
      if (!usuarioActual) {
        mostrarAuthModal();
        return;
      }

      try {
        const res = await fetch(ENDPOINT + `/api/votos/${tabla}/${id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario_id: usuarioActual.id, tipo_voto: tipo })
        });
        const data = await res.json();
        if (data.ok && preguntaSeleccionada) {
          cargarPreguntas();
        }
      } catch (e) {
        console.error("Error votando:", e);
      }
    }

    // Init
    window.addEventListener("load", () => {
      inicializarTema();
      const guardado = localStorage.getItem("usuario");
      if (guardado) {
        usuarioActual = JSON.parse(guardado);
      }
      actualizarUserStatus();
      cargarPreguntas();
    });

    // Enter en buscador
    document.getElementById("buscar").addEventListener("keypress", (e) => {
      if (e.key === "Enter") buscar();
    });
  </script>
</body>
</html>
