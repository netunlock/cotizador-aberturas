<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Cotizador de Aberturas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .admin-header h1 { margin: 0; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-value { font-size: 2.5rem; font-weight: 700; color: var(--color-primary); }
    .stat-label { font-size: 0.9rem; color: var(--color-text-muted); margin-top: 8px; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--color-border);
    }
    .tab-btn {
      padding: 12px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 500;
      color: var(--color-text-muted);
      transition: all 0.2s;
    }
    .tab-btn.activo {
      border-bottom-color: var(--color-primary);
      color: var(--color-primary);
    }
    .tab-btn:hover { color: var(--color-text); }

    .tab-content { display: none; }
    .tab-content.visible { display: block; }

    .tabla {
      width: 100%;
      border-collapse: collapse;
      background: var(--color-surface);
      border-radius: 8px;
      overflow: hidden;
    }
    .tabla th {
      background: var(--color-bg-alt);
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 1px solid var(--color-border);
    }
    .tabla td {
      padding: 12px;
      border-bottom: 1px solid var(--color-border);
    }
    .tabla tr:hover { background: var(--color-bg-alt); }

    .btn-pequeño {
      padding: 6px 12px;
      font-size: 0.8rem;
      background: var(--color-error);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-pequeño:hover { opacity: 0.9; }

    .login-form {
      max-width: 400px;
      background: var(--color-bg-alt);
      padding: 40px;
      border-radius: 12px;
      margin: 100px auto;
    }
    .login-form h2 { margin-top: 0; }
    .form-grupo {
      margin-bottom: 16px;
    }
    .form-grupo label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-grupo input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--color-campo-borde);
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
    }

    .loading { text-align: center; color: var(--color-text-muted); padding: 40px; }
    .error { background: #fee; color: #c33; padding: 12px; border-radius: 6px; margin: 10px 0; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" /><line x1="12" y1="3" x2="12" y2="21" /><line x1="3" y1="12" x2="12" y2="12" />
          </svg>
        </span>
        <span class="brand__text"><strong>Admin</strong></span>
      </a>
      <div>
        <span id="adminNombre" style="color: var(--color-text-muted); margin-right: 20px;"></span>
        <button class="btn btn--primary btn--sm" onclick="logout()">Salir</button>
      </div>
    </div>
  </header>

  <!-- Login -->
  <div id="loginForm" class="login-form">
    <h2>Acceso de Administrador</h2>
    <form onsubmit="login(event)">
      <div class="form-grupo">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-grupo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
      </div>
      <button class="btn btn--primary" type="submit" style="width: 100%;">Ingresar</button>
      <div id="loginError"></div>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display: none;">
    <div class="admin-container">
      <div class="admin-header">
        <h1>Panel de Administración</h1>
      </div>

      <!-- Estadísticas -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn activo" onclick="cambiarTab('preguntas')">Preguntas</button>
        <button class="tab-btn" onclick="cambiarTab('usuarios')">Usuarios</button>
      </div>

      <!-- Preguntas -->
      <div id="preguntas" class="tab-content visible">
        <div id="preguntasLista" class="loading">Cargando preguntas...</div>
      </div>

      <!-- Usuarios -->
      <div id="usuarios" class="tab-content">
        <div id="usuariosLista" class="loading">Cargando usuarios...</div>
      </div>
    </div>
  </div>

  <script>
    const ENDPOINT = "https://cotizador-forum.fgpereyra-92.workers.dev";
    const ADMIN_TOKEN = "admin123"; // Token simple, en producción usar JWT
    let usuarioAdmin = null;

    // Login
    function login(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Credenciales: admin@cotaber / lucardo
      if (email === "admin@cotaber" && password === "lucardo") {
        usuarioAdmin = { email, nombre: "Administrador" };
        localStorage.setItem("adminLogin", JSON.stringify(usuarioAdmin));
        mostrarDashboard();
      } else {
        document.getElementById("loginError").innerHTML = '<div class="error">Credenciales inválidas</div>';
      }
    }

    function logout() {
      usuarioAdmin = null;
      localStorage.removeItem("adminLogin");
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
    }

    function mostrarDashboard() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      document.getElementById("adminNombre").textContent = usuarioAdmin.nombre;
      cargarDatos();
    }

    // Datos
    async function cargarDatos() {
      try {
        // Estadísticas
        const statsRes = await fetch(`${ENDPOINT}/api/admin/stats?token=${ADMIN_TOKEN}`);
        const stats = await statsRes.json();

        if (stats.ok) {
          document.getElementById("statsGrid").innerHTML = `
            <div class="stat-card">
              <div class="stat-value">${stats.stats.total_preguntas}</div>
              <div class="stat-label">Preguntas</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${stats.stats.total_respuestas}</div>
              <div class="stat-label">Respuestas</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${stats.stats.usuarios_registrados}</div>
              <div class="stat-label">Usuarios (Registrados)</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${stats.stats.usuarios_invitados}</div>
              <div class="stat-label">Usuarios (Invitados)</div>
            </div>
          `;
        }

        // Preguntas
        const preguntasRes = await fetch(`${ENDPOINT}/api/preguntas`);
        const preguntas = await preguntasRes.json();

        if (preguntas.preguntas && preguntas.preguntas.length > 0) {
          document.getElementById("preguntasLista").innerHTML = `
            <table class="tabla">
              <thead>
                <tr>
                  <th>Título</th>
                  <th>Autor</th>
                  <th>Categoría</th>
                  <th>Votos</th>
                  <th>Acción</th>
                </tr>
              </thead>
              <tbody>
                ${preguntas.preguntas.map(p => `
                  <tr>
                    <td>${p.titulo || p.contenido.substring(0, 50)}</td>
                    <td>${p.autor}</td>
                    <td>${p.categoria_nombre}</td>
                    <td>${p.votos}</td>
                    <td><button class="btn-pequeño" onclick="eliminarPregunta(${p.id})">Eliminar</button></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `;
        } else {
          document.getElementById("preguntasLista").innerHTML = "<p>No hay preguntas</p>";
        }

        // Usuarios
        const usuariosRes = await fetch(`${ENDPOINT}/api/admin/usuarios?token=${ADMIN_TOKEN}`);
        const usuarios = await usuariosRes.json();

        if (usuarios.ok && usuarios.usuarios && usuarios.usuarios.length > 0) {
          document.getElementById("usuariosLista").innerHTML = `
            <table class="tabla">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Email</th>
                  <th>Tipo</th>
                  <th>Fecha</th>
                </tr>
              </thead>
              <tbody>
                ${usuarios.usuarios.map(u => `
                  <tr>
                    <td>${u.nombre}</td>
                    <td>${u.email}</td>
                    <td>${u.es_invitado ? "Invitado" : "Registrado"}</td>
                    <td>${new Date(u.fecha_creacion).toLocaleDateString()}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `;
        } else {
          document.getElementById("usuariosLista").innerHTML = "<p>No hay usuarios</p>";
        }
      } catch (e) {
        console.error("Error cargando datos:", e);
      }
    }

    function cambiarTab(tab) {
      document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("visible"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("activo"));

      document.getElementById(tab).classList.add("visible");
      event.target.classList.add("activo");
    }

    async function eliminarPregunta(id) {
      if (confirm("¿Eliminar esta pregunta?")) {
        try {
          const res = await fetch(`${ENDPOINT}/api/admin/preguntas/${id}?token=${ADMIN_TOKEN}`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" }
          });

          if (!res.ok) {
            alert(`Error: ${res.status} ${res.statusText}`);
            return;
          }

          const data = await res.json();
          if (data.ok) {
            alert("✓ Pregunta eliminada correctamente");
            cargarDatos();
          } else {
            alert(`Error: ${data.error || "Error desconocido"}`);
          }
        } catch (e) {
          console.error("Error eliminando:", e);
          alert("Error: " + e.message);
        }
      }
    }

    // Init
    window.addEventListener("load", () => {
      const guardado = localStorage.getItem("adminLogin");
      if (guardado) {
        usuarioAdmin = JSON.parse(guardado);
        mostrarDashboard();
      }
    });
  </script>
</body>
</html>
