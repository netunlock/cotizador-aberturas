<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Cotizador de Aberturas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .admin-header h1 { margin: 0; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-value { font-size: 2.5rem; font-weight: 700; color: var(--color-primary); }
    .stat-label { font-size: 0.9rem; color: var(--color-text-muted); margin-top: 8px; }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--color-border);
    }
    .tab-btn {
      padding: 12px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-weight: 500;
      color: var(--color-text-muted);
      transition: all 0.2s;
    }
    .tab-btn.activo {
      border-bottom-color: var(--color-primary);
      color: var(--color-primary);
    }
    .tab-btn:hover { color: var(--color-text); }

    .tab-content { display: none; }
    .tab-content.visible { display: block; }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 2px;
      font-size: 10px;
      font-weight: bold;
    }

    .badge.visible {
      background: var(--color-success);
      color: white;
    }

    .badge.oculto {
      background: var(--color-error);
      color: white;
    }

    .btn-pequeno {
      padding: 6px 10px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      font-size: 10px;
      margin-right: 5px;
      transition: 0.2s;
    }

    .btn-pequeno:hover {
      background: var(--color-primary-hover);
      opacity: 0.8;
    }

    .tabla {
      width: 100%;
      border-collapse: collapse;
      background: var(--color-surface);
      border-radius: 8px;
      overflow: hidden;
    }
    .tabla th {
      background: var(--color-bg-alt);
      padding: 12px;
      text-align: left;
      font-weight: 600;
      border-bottom: 1px solid var(--color-border);
    }
    .tabla td {
      padding: 12px;
      border-bottom: 1px solid var(--color-border);
    }
    .tabla tr:hover { background: var(--color-bg-alt); }

    .btn-pequeño {
      padding: 6px 12px;
      font-size: 0.8rem;
      background: var(--color-error);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-pequeño:hover { opacity: 0.9; }

    .login-form {
      max-width: 400px;
      background: var(--color-bg-alt);
      padding: 40px;
      border-radius: 12px;
      margin: 100px auto;
    }
    .login-form h2 { margin-top: 0; }
    .form-grupo {
      margin-bottom: 16px;
    }
    .form-grupo label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-grupo input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--color-campo-borde);
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
    }

    .loading { text-align: center; color: var(--color-text-muted); padding: 40px; }
    .error { background: #fee; color: #c33; padding: 12px; border-radius: 6px; margin: 10px 0; }

    .insignia {
      display: inline-block;
      font-size: 10px;
      padding: 1px 5px;
      border: 1px solid var(--color-border);
      border-radius: 3px;
      color: var(--color-text-muted);
    }
    .tarjeta-moderacion {
      background: var(--color-bg-alt);
      border: 1px solid var(--color-border);
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 3px;
    }
    .miniaturas { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .miniaturas img { max-width: 140px; max-height: 105px; border: 1px solid var(--color-border); border-radius: 3px; }
    button:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" /><line x1="12" y1="3" x2="12" y2="21" /><line x1="3" y1="12" x2="12" y2="12" />
          </svg>
        </span>
        <span class="brand__text"><strong>Admin</strong></span>
      </a>
      <div>
        <span id="adminNombre" style="color: var(--color-text-muted); margin-right: 20px;"></span>
        <button class="btn btn--primary btn--sm" onclick="logout()">Salir</button>
      </div>
    </div>
  </header>

  <!-- Login -->
  <div id="loginForm" class="login-form">
    <h2>Acceso de Administrador</h2>
    <form onsubmit="login(event)">
      <div class="form-grupo">
        <label for="password">Contraseña de administrador</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button class="btn btn--primary" type="submit" style="width: 100%;">Ingresar</button>
      <div id="loginError"></div>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display: none;">
    <div class="admin-container">
      <div class="admin-header">
        <h1>Panel de Administración</h1>
      </div>

      <!-- Estadísticas -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn activo" onclick="cambiarTab('preguntas', this)">Preguntas</button>
        <button class="tab-btn" onclick="cambiarTab('respuestas', this)">Respuestas</button>
        <button class="tab-btn" onclick="cambiarTab('usuarios', this)">Usuarios</button>
        <button class="tab-btn" onclick="cambiarTab('moderacion', this)">Moderación</button>
      </div>

      <!-- Preguntas -->
      <div id="preguntas" class="tab-content visible">
        <div id="preguntasLista" class="loading">Cargando preguntas...</div>
      </div>

      <!-- Respuestas -->
      <div id="respuestas" class="tab-content">
        <div id="respuestasLista" class="loading">Cargando respuestas...</div>
      </div>

      <!-- Usuarios -->
      <div id="usuarios" class="tab-content">
        <div id="usuariosLista" class="loading">Cargando usuarios...</div>
      </div>

      <!-- Moderación -->
      <div id="moderacion" class="tab-content">
        <div id="moderacionLista" class="loading">Cargando contenido para moderar...</div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
