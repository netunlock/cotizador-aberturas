name = "cotizador-forum"
main = "src/worker.js"
compatibility_date = "2024-09-09"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "cotizador-forum"
database_id = "53320c1e-4b7d-4d5e-975c-8df30c94ef36"

# ---------------------------------------------------------------------
# SECRETOS: acá NO van. Este archivo es público (está en el repo y
# GitHub Pages lo sirve). El worker necesita dos, que se cargan con:
#
#   wrangler secret put SESSION_SECRET   → clave para firmar las sesiones
#   wrangler secret put ADMIN_PASSWORD   → contraseña del panel admin.html
#
# Si falta alguno, el worker NO usa un valor por defecto: rechaza los
# logins (falla cerrado). Para probar en tu PC con `wrangler dev`, poné
# esos mismos nombres en un archivo .dev.vars (ya está en .gitignore)
# con valores de prueba. Si algún día sumás Turnstile u otra clave, va
# por el mismo camino. Detalles en la sección "Foro" del README.
# ---------------------------------------------------------------------
